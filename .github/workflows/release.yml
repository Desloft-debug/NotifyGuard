name: Release

# Запускается, когда вы отправляете тег вида v1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/NotifyGuard-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            APK собран автоматически из исходников этого репозитория.

            Подпись отладочная — Android при установке предупредит,
            что источник неизвестен. Это ожидаемо для приложения,
            которое не публикуется в Google Play.

            После установки откройте приложение и пройдите блок
            «Доступ»: без разрешения на чтение уведомлений фильтр
            не работает. Подробности в README.
