name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Ключ хранится в секретах репозитория в виде base64.
      # На диск раннера он попадает только на время сборки.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета KEYSTORE_BASE64: подписать релиз нечем."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # Сумму кладём в описание релиза: приложение сверяет её после загрузки.
      - name: Prepare artifact
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/NotifyGuard-${GITHUB_REF_NAME}.apk"
          sum=$(sha256sum "out/NotifyGuard-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            APK собран автоматически из исходников этого репозитория.

            sha256: ${{ steps.apk.outputs.sha256 }}

            При установке Android предупредит о неизвестном источнике —
            это нормально для приложения, которого нет в Google Play.

            После установки откройте приложение и пройдите блок «Доступ»:
            без разрешения на чтение уведомлений фильтр не работает.
            Подробности в README.
